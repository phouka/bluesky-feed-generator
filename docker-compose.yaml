
services:
    feed_gen:
        build:
            context: ./
        depends_on:
            - db
        ports:
            - "8000"
    
    nginx:
        image: nginx:latest
        restart: unless-stopped
        env_file: .env.nginx
        volumes:
            - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
            - ./nginx/certbot/conf:/etc/letsencrypt
            - ./nginx/certbot/www:/var/www/certbot
        depends_on:
            - feed_gen
        ports:
            - "80:80"
            - "443:443"
            
    certbot:
        image: certbot/certbot
        volumes:
            - ./nginx/certbot/conf:/etc/letsencrypt
            - ./nginx/certbot/www:/var/www/certbot
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 24h & wait $${!}; done;'" # renew certificates daily

    db:
        image: postgres:17
        restart: unless-stopped
        env_file: .env.db
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata: