
services:
    feed_gen:
        build:
            context: ./
        volumes:
            - ./feed_database.db:/app/feed_database.db
        ports:
            - "8000"
    
    nginx:
        image: nginx:latest
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - feed_gen
        ports:
            - "80:80"